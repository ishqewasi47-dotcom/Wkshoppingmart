<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cart — WK Online Mart</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <div class="header-row">
    <a href="index.html" class="brand">WK <span>Online Mart</span></a>
    <form id="searchForm" class="search-box" role="search">
      <input id="searchInput" type="text" placeholder="Products talaash karein...">
      <button type="submit">Search</button>
    </form>
    <div class="header-actions">
      <a id="accountLink" class="icon-link" href="login.html" title="Account">👤</a>
      <a class="icon-link" href="cart.html" title="Cart">🛒<span id="cartCount" class="cart-count" style="display:none">0</span></a>
      <a class="admin-mini" href="admin-login.html">Admin</a>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="section-title"><h2>Aapka Cart</h2></div>
  <div class="cart-layout" id="cartLayout">
    <p style="color:var(--ink-soft)">Loading...</p>
  </div>
</main>

<footer>&copy; 2026 WK Online Mart.</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="common.js"></script>
<script>
let cartRows = [];

async function loadCart() {
  const layout = document.getElementById("cartLayout");
  const user = await requireCustomerAuth();
  if (!user) return;

  const { data, error } = await supabaseClient
    .from("cart_items")
    .select("*, products(*)")
    .eq("user_id", user.id)
    .order("created_at");

  if (error) { layout.innerHTML = "<p>Cart load nahi ho saka.</p>"; return; }
  cartRows = data || [];

  if (cartRows.length === 0) {
    layout.innerHTML = `<div class="empty-state">Cart khali hai. <a href="index.html">Shopping shuru karein &rarr;</a></div>`;
    return;
  }

  const listHtml = cartRows.map(row => {
    const p = row.products;
    const img = p.image_url || "https://placehold.co/150x200?text=WK";
    return `
      <div class="cart-item" data-id="${row.id}">
        <img src="${img}" alt="">
        <div class="cart-item-info">
          <div class="name">${esc(p.name)}</div>
          <div class="price">${fmtPrice(p.price)}</div>
          <div class="cart-qty">
            <button class="qtyDec">−</button>
            <span class="qtyVal">${row.quantity}</span>
            <button class="qtyInc">+</button>
            <button class="removeBtn btn btn-outline btn-sm" style="margin-left:14px">Hatayein</button>
          </div>
        </div>
        <div class="price">${fmtPrice(p.price * row.quantity)}</div>
      </div>`;
  }).join("");

  const total = cartRows.reduce((s, r) => s + r.products.price * r.quantity, 0);

  layout.innerHTML = `
    <div class="cart-list">${listHtml}</div>
    <div class="cart-summary">
      <div class="summary-row"><span>Subtotal</span><span>${fmtPrice(total)}</span></div>
      <div class="summary-row"><span>Delivery</span><span>Cash on Delivery</span></div>
      <div class="summary-row total"><span>Total</span><span>${fmtPrice(total)}</span></div>
      <a href="checkout.html" class="btn btn-wine btn-block">Checkout Karein</a>
    </div>
  `;

  document.querySelectorAll(".qtyInc").forEach(btn => btn.addEventListener("click", (e) => changeQty(e, 1)));
  document.querySelectorAll(".qtyDec").forEach(btn => btn.addEventListener("click", (e) => changeQty(e, -1)));
  document.querySelectorAll(".removeBtn").forEach(btn => btn.addEventListener("click", removeItem));
}

async function changeQty(e, delta) {
  const rowEl = e.target.closest(".cart-item");
  const id = rowEl.dataset.id;
  const row = cartRows.find(r => r.id === id);
  const newQty = row.quantity + delta;
  if (newQty < 1) return;
  if (newQty > row.products.stock) { alert("Itni stock available nahi hai."); return; }
  await supabaseClient.from("cart_items").update({ quantity: newQty }).eq("id", id);
  loadCart();
  refreshCartCount();
}

async function removeItem(e) {
  const rowEl = e.target.closest(".cart-item");
  const id = rowEl.dataset.id;
  await supabaseClient.from("cart_items").delete().eq("id", id);
  loadCart();
  refreshCartCount();
}

loadCart();
</script>
</body>
</html>
