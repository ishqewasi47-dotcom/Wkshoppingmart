<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mera Account — WK Online Mart</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <div class="header-row">
    <a href="index.html" class="brand">WK <span>Online Mart</span></a>
    <div class="header-actions" style="margin-left:auto">
      <a class="icon-link" href="cart.html" title="Cart">🛒<span id="cartCount" class="cart-count" style="display:none">0</span></a>
      <button id="logoutBtn" class="admin-mini" style="cursor:pointer">Logout</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="section-title"><h2>Mera Account</h2></div>
  <div class="tabs">
    <button class="active" data-tab="profile">Profile</button>
    <button data-tab="orders">Order History</button>
  </div>

  <div id="tab-profile">
    <form id="profileForm" class="form-card" style="margin:0 0 40px">
      <div class="field"><label>Pura Naam</label><input type="text" id="pName" required></div>
      <div class="field"><label>Phone</label><input type="tel" id="pPhone" required></div>
      <div class="field"><label>Address</label><textarea id="pAddress"></textarea></div>
      <button type="submit" class="btn btn-wine btn-block">Profile Save Karein</button>
      <div id="pMsg" class="form-msg"></div>
    </form>

    <h3 style="margin-top:30px">Password Tabdeel Karein</h3>
    <form id="pwForm" class="form-card" style="margin:0">
      <div class="field"><label>Naya Password</label><input type="password" id="newPw" minlength="6" required></div>
      <button type="submit" class="btn btn-outline btn-block">Password Update Karein</button>
      <div id="pwMsg" class="form-msg"></div>
    </form>
  </div>

  <div id="tab-orders" style="display:none">
    <div id="ordersList"><p style="color:var(--ink-soft)">Loading...</p></div>
  </div>
</main>

<footer>&copy; 2026 WK Online Mart.</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="common.js"></script>
<script>
let currentUser = null;

document.querySelectorAll(".tabs button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("tab-profile").style.display = btn.dataset.tab === "profile" ? "block" : "none";
    document.getElementById("tab-orders").style.display = btn.dataset.tab === "orders" ? "block" : "none";
  });
});

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await supabaseClient.auth.signOut();
  window.location.href = "index.html";
});

async function loadProfile() {
  const { data } = await supabaseClient.from("profiles").select("*").eq("id", currentUser.id).maybeSingle();
  document.getElementById("pName").value = data?.full_name || "";
  document.getElementById("pPhone").value = data?.phone || "";
  document.getElementById("pAddress").value = data?.address || "";
}

document.getElementById("profileForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("pMsg");
  const { error } = await supabaseClient.from("profiles").upsert({
    id: currentUser.id,
    full_name: document.getElementById("pName").value.trim(),
    phone: document.getElementById("pPhone").value.trim(),
    address: document.getElementById("pAddress").value.trim()
  });
  msg.textContent = error ? error.message : "Profile save ho gayi.";
  msg.className = "form-msg " + (error ? "error" : "success");
});

document.getElementById("pwForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("pwMsg");
  const newPw = document.getElementById("newPw").value;
  const { error } = await supabaseClient.auth.updateUser({ password: newPw });
  msg.textContent = error ? error.message : "Password update ho gaya.";
  msg.className = "form-msg " + (error ? "error" : "success");
  if (!error) e.target.reset();
});

async function loadOrders() {
  const list = document.getElementById("ordersList");
  const { data: orders, error } = await supabaseClient
    .from("orders").select("*, order_items(*)")
    .eq("customer_id", currentUser.id)
    .order("created_at", { ascending: false });

  if (error) { list.innerHTML = "<p>Orders load nahi hue.</p>"; return; }
  if (!orders || orders.length === 0) { list.innerHTML = `<div class="empty-state">Abhi tak koi order nahi kiya.</div>`; return; }

  list.innerHTML = orders.map(o => `
    <div class="order-card">
      <div class="order-card-head">
        <strong>#${esc(o.order_number)}</strong>
        <span class="badge ${o.status}">${esc(o.status)}</span>
      </div>
      ${o.order_items.map(it => `<div class="order-line"><span>${esc(it.product_name)} x${it.quantity}</span><span>${fmtPrice(it.price * it.quantity)}</span></div>`).join("")}
      <div class="order-line" style="font-weight:700"><span>Total</span><span>${fmtPrice(o.total_amount)}</span></div>
      <div class="order-line"><span>Date</span><span>${new Date(o.created_at).toLocaleDateString()}</span></div>
    </div>
  `).join("");
}

(async function init() {
  currentUser = await requireCustomerAuth();
  if (!currentUser) return;
  await loadProfile();
  await loadOrders();
  refreshCartCount();
})();
</script>
</body>
</html>
