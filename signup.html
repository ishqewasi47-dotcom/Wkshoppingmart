<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign Up — WK Online Mart</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <div class="header-row">
    <a href="index.html" class="brand">WK <span>Online Mart</span></a>
  </div>
</header>

<div class="form-card">
  <h1>Account Banayein</h1>
  <p class="form-sub">Shopping shuru karne ke liye signup karein.</p>
  <form id="signupForm">
    <div class="field">
      <label>Pura Naam</label>
      <input type="text" id="fullName" required>
    </div>
    <div class="field">
      <label>Phone Number</label>
      <input type="tel" id="phone" required placeholder="03xx-xxxxxxx">
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="email" required>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" required minlength="6">
    </div>
    <button type="submit" class="btn btn-wine btn-block">Account Banayein</button>
    <div id="msg" class="form-msg"></div>
  </form>
  <div class="form-alt">Pehle se account hai? <a href="login.html">Login karein</a></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="common.js"></script>
<script>
document.getElementById("signupForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("msg");
  msg.textContent = ""; msg.className = "form-msg";

  const fullName = document.getElementById("fullName").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const { data, error } = await supabaseClient.auth.signUp({ email, password });
  if (error) { msg.textContent = error.message; msg.classList.add("error"); return; }

  const userId = data.user?.id;
  if (userId) {
    await supabaseClient.from("profiles").insert({
      id: userId, full_name: fullName, phone: phone
    });
  }

  if (data.session) {
    window.location.href = "index.html";
  } else {
    msg.textContent = "Account ban gaya. Email verify karke login karein.";
    msg.classList.add("success");
  }
});
</script>
</body>
</html>
