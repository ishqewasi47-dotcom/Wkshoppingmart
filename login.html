<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — WK Online Mart</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <div class="header-row">
    <a href="index.html" class="brand">WK <span>Online Mart</span></a>
  </div>
</header>

<div class="form-card">
  <h1>Login Karein</h1>
  <p class="form-sub">Shopping jari rakhne ke liye apne account mein login karein.</p>
  <form id="loginForm">
    <div class="field">
      <label>Email</label>
      <input type="email" id="email" required>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" required>
    </div>
    <button type="submit" class="btn btn-wine btn-block">Login</button>
    <div id="msg" class="form-msg"></div>
  </form>
  <div class="form-alt">Account nahi hai? <a href="signup.html">Sign up karein</a></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="common.js"></script>
<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("msg");
  msg.textContent = ""; msg.className = "form-msg";
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (error) { msg.textContent = error.message; msg.classList.add("error"); return; }

  const redirect = new URLSearchParams(location.search).get("redirect");
  window.location.href = redirect || "index.html";
});
</script>
</body>
</html>
